<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SummTracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <button id="collapse-btn" title="Hide overlay">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <span id="titlebar-label">SummTracker</span>
      <button id="settings-btn" title="Settings">⚙</button>
      <button id="close-btn" title="Quit">✕</button>
    </div>

    <div id="content">
      <div id="settings-panel" class="screen hidden">
        <div class="setting-row">
          <span class="setting-label">Show own team</span>
          <label class="toggle"><input type="checkbox" id="s-own-team" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Champion name</span>
          <label class="toggle"><input type="checkbox" id="s-champ-name" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Summoner name</span>
          <label class="toggle"><input type="checkbox" id="s-summoner-name" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Timer format</span>
          <div class="format-toggle">
            <button class="fmt-btn active" data-fmt="mm:ss">m:ss</button>
            <button class="fmt-btn" data-fmt="s">sec</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Collapse bind</span>
          <button id="s-collapse-bind" class="bind-btn">None</button>
        </div>
        <div class="setting-row">
          <span class="setting-label">Launch on startup</span>
          <label class="toggle"><input type="checkbox" id="s-autostart"><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Auto accept queue</span>
          <label class="toggle"><input type="checkbox" id="s-auto-accept"><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Background opacity</span>
          <div class="opacity-control">
            <input type="range" id="s-opacity" min="0" max="100" step="5" value="90" />
            <span id="s-opacity-value">90%</span>
          </div>
        </div>
      </div>

      <div id="idle-screen" class="screen">
        <div class="waiting">Waiting for game...</div>
      </div>

      <div id="champ-select-screen" class="screen hidden">
        <div class="cs-header">
          <div id="cs-mode-label" class="team-label ally-label">ARAM</div>
          <div id="cs-you" class="cs-you"></div>
        </div>
        <div id="cs-status" class="cs-status"></div>
        <div id="cs-cards-wrap" class="cs-section hidden">
          <div class="team-label">Your cards - click to pick</div>
          <div id="cs-cards" class="bench-grid"></div>
        </div>
        <div id="cs-allies-wrap" class="cs-section">
          <div class="team-label ally-label">Allies</div>
          <div id="cs-allies"></div>
        </div>
        <div id="cs-bench-wrap" class="cs-section">
          <div class="team-label">Bench - click to swap or queue</div>
          <div id="cs-bench" class="bench-grid"></div>
        </div>
      </div>

      <div id="game-screen" class="screen hidden">
        <div class="team-block" id="team-order"></div>
        <div class="divider"></div>
        <div class="team-block" id="team-chaos"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
